<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="512" height="512" rx="128" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.25"/>
  <g filter="url(#glow)">
    <rect x="116" y="196" width="36" height="120" rx="18" fill="url(#neon)"/>
    <rect x="180" y="136" width="36" height="240" rx="18" fill="url(#neon)"/>
    <rect x="244" y="166" width="36" height="180" rx="18" fill="url(#neon)"/>
    <rect x="308" y="106" width="36" height="300" rx="18" fill="url(#neon)"/>
    <rect x="372" y="216" width="36" height="80" rx="18" fill="url(#neon)"/>
  </g>
</svg>
